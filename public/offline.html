<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <title>Mode Offline - TaskFlow</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: rgba(24, 24, 27, 0.94);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: rgba(255, 255, 255, 0.94);
        --border: rgba(0, 0, 0, 0.08);
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem auto;
      border-radius: 14px;
      background: rgba(59, 130, 246, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      text-wrap: balance;
    }

    p {
      color: var(--text-muted);
      font-size: 0.9375rem;
      line-height: 1.55;
      margin-bottom: 2rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    .btn-retry:hover {
      background-color: var(--primary-hover);
    }

    .btn-retry:active {
      transform: scale(0.98);
    }

    .btn-retry svg {
      width: 18px;
      height: 18px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f59e0b;
    }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0-4 7h1.26a5 5 0 0 0 9.74 2" />
        <line x1="1" y1="1" x2="23" y2="23" />
      </svg>
    </div>

    <h1>Koneksi Sedang Terputus</h1>
    <p>
      Perangkat Anda saat ini berada di luar jangkauan internet. Data lokal tetap tersimpan aman di peramban dan akan disinkronkan otomatis saat koneksi kembali aktif.
    </p>

    <button type="button" class="btn-retry" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
      </svg>
      Coba Muat Ulang
    </button>

    <div class="badge-status">
      <span class="badge-dot" aria-hidden="true"></span>
      <span>Penyimpanan lokal aktif</span>
    </div>
  </main>
</body>
</html>
