<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241912" />
      <stop offset="100%" stop-color="#120D0A" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D97706" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas Background -->
  <rect width="512" height="512" rx="108" fill="#0C0A09" />
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />

  <!-- Outer Glass Badge with Amber Rim -->
  <rect x="56" y="56" width="400" height="400" rx="92" fill="url(#badgeGrad)" stroke="#D97706" stroke-width="8" filter="url(#amberGlow)" />

  <!-- Inner Checkbox Square Frame -->
  <rect x="136" y="136" width="240" height="240" rx="48" fill="none" stroke="#F59E0B" stroke-width="16" stroke-opacity="0.85" />

  <!-- Bold Crisp White Checkmark -->
  <polyline points="196,258 244,306 328,212" fill="none" stroke="#FAFAFA" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>